<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Michi - Mi Mascota Virtual</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #fefce8 0%, #fef08a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px 16px;
      overflow: hidden;
      position: relative;
    }

    .bg-particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      pointer-events: none;
      animation: floatBg 8s infinite ease-in-out;
    }

    @keyframes floatBg {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.5; }
      50% { transform: translateY(-30px) scale(1.1); opacity: 0.9; }
    }

    .header {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    .nombre-mascota {
      color: #ca8a04;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
      text-shadow: 0 2px 10px rgba(234, 179, 8, 0.3);
    }

    .barras-container {
      width: 100%;
      display: flex;
      gap: 12px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      padding: 12px 16px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(202, 138, 4, 0.12);
      border: 2px solid rgba(255, 255, 255, 0.9);
    }

    .barra-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .barra-label {
      font-size: 12px;
      font-weight: 800;
      color: #854d0e;
      display: flex;
      justify-content: space-between;
    }

    .progreso-track {
      background: #fef08a;
      height: 12px;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .progreso-fill {
      height: 100%;
      width: 100%;
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    #fill-hambre {
      background: linear-gradient(90deg, #34d399, #10b981);
    }

    #fill-felicidad {
      background: linear-gradient(90deg, #fbbf24, #f59e0b);
    }

    .stage {
      flex: 1;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 5;
    }

    .speech-bubble {
      background: #ffffff;
      color: #713f12;
      padding: 12px 18px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 13px;
      line-height: 1.4;
      box-shadow: 0 10px 25px rgba(202, 138, 4, 0.12);
      margin-bottom: 20px;
      position: relative;
      border: 2px solid #eab308;
      max-width: 90%;
      text-align: center;
      transition: transform 0.2s ease;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 10px 10px 0;
      border-style: solid;
      border-color: #ffffff transparent;
      display: block;
      width: 0;
    }

    .speech-bubble::before {
      content: '';
      position: absolute;
      bottom: -13px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 11px 11px 0;
      border-style: solid;
      border-color: #eab308 transparent;
      display: block;
      width: 0;
    }

    .michi-wrapper {
      width: 180px;
      height: 180px;
      cursor: pointer;
      position: relative;
      animation: floatIdle 3.5s infinite ease-in-out;
      transition: transform 0.2s ease;
    }

    @keyframes floatIdle {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
    }

    .michi-wrapper.happy-bounce {
      animation: bounce 0.6s ease;
    }

    .michi-wrapper.eat-wiggle {
      animation: wiggle 0.5s ease;
    }

    .michi-wrapper.surprise-entry {
      animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0) rotate(-15deg); opacity: 0; }
      70% { transform: scale(1.2) rotate(5deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-25px) scale(1.1, 0.9); }
      60% { transform: translateY(0) scale(0.95, 1.05); }
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-8deg) scale(1.05); }
      75% { transform: rotate(8deg) scale(1.05); }
    }

    .shadow {
      width: 120px;
      height: 16px;
      background: rgba(202, 138, 4, 0.18);
      border-radius: 50%;
      margin-top: 10px;
      animation: shadowScale 3.5s infinite ease-in-out;
    }

    @keyframes shadowScale {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(0.75); opacity: 0.25; }
    }

    .controls {
      width: 100%;
      max-width: 400px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }

    .btn {
      flex: 1;
      background: #ffffff;
      color: #854d0e;
      border: none;
      padding: 16px 10px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 16px;
      box-shadow: 0 8px 20px rgba(202, 138, 4, 0.15);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 2px solid rgba(255, 255, 255, 0.8);
      touch-action: manipulation;
    }

    .btn:active {
      transform: scale(0.92);
      box-shadow: 0 4px 10px rgba(202, 138, 4, 0.1);
    }

    .btn-icon {
      font-size: 22px;
    }

    .confetti-particle, .heart-particle {
      position: absolute;
      pointer-events: none;
      animation: floatUp 1.2s forwards ease-out;
      z-index: 20;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8) rotate(0deg); }
      100% { opacity: 0; transform: translateY(-70px) scale(1.4) rotate(45deg); }
    }
  </style>
</head>
<body>

  <div class="bg-particle" style="width: 80px; height: 80px; top: 10%; left: 10%;"></div>
  <div class="bg-particle" style="width: 120px; height: 120px; top: 60%; right: 5%; animation-delay: -3s;"></div>

  <div class="header">
    <div class="nombre-mascota">Michi</div>
    <div class="barras-container">
      <div class="barra-item">
        <div class="barra-label"><span>Hambre</span><span id="txt-hambre">100%</span></div>
        <div class="progreso-track"><div class="progreso-fill" id="fill-hambre"></div></div>
      </div>
      <div class="barra-item">
        <div class="barra-label"><span>Felicidad</span><span id="txt-felicidad">100%</span></div>
        <div class="progreso-track"><div class="progreso-fill" id="fill-felicidad"></div></div>
      </div>
    </div>
  </div>

  <div class="stage">
    <div class="speech-bubble" id="bocadillo">¡Hola! Tócame para aprender algo nuevo 🐾</div>
    
    <div class="michi-wrapper surprise-entry" id="michi-box" onclick="acariciar(event)">
      <svg id="michi-svg" viewBox="0 0 100 100" width="100%" height="100%">
        <path d="M 75 75 Q 92 60 85 45" fill="none" stroke="#f4a261" stroke-width="5" stroke-linecap="round">
          <animateTransform attributeName="transform" type="rotate" values="0 75 75; 8 75 75; 0 75 75" dur="2s" repeatCount="indefinite"/>
        </path>

        <polygon points="22,40 12,18 36,28" fill="#f4a261" stroke="#e76f51" stroke-width="2"/>
        <polygon points="24,36 17,22 33,28" fill="#ffb703"/>
        
        <polygon points="78,40 88,18 64,28" fill="#f4a261" stroke="#e76f51" stroke-width="2"/>
        <polygon points="76,36 83,22 67,28" fill="#ffb703"/>

        <ellipse cx="50" cy="58" rx="32" ry="28" fill="#f4a261" stroke="#e76f51" stroke-width="2.5"/>

        <ellipse cx="32" cy="62" rx="5" ry="3" fill="#ffb5a7" opacity="0.8"/>
        <ellipse cx="68" cy="62" rx="5" ry="3" fill="#ffb5a7" opacity="0.8"/>

        <g>
          <line x1="18" y1="58" x2="30" y2="60" stroke="#2b2d42" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="16" y1="64" x2="29" y2="63" stroke="#2b2d42" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="82" y1="58" x2="70" y2="60" stroke="#2b2d42" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="84" y1="64" x2="71" y2="63" stroke="#2b2d42" stroke-width="1.5" stroke-linecap="round"/>
          <animateTransform attributeName="transform" type="translate" values="0,0; 0,1; 0,0" dur="3s" repeatCount="indefinite"/>
        </g>

        <polygon points="48,58 52,58 50,60" fill="#e76f51"/>

        <g id="ojos">
          <circle cx="38" cy="52" r="4.5" fill="#2b2d42"/>
          <circle cx="36.5" cy="50.5" r="1.5" fill="#ffffff"/>
          <circle cx="62" cy="52" r="4.5" fill="#2b2d42"/>
          <circle cx="60.5" cy="50.5" r="1.5" fill="#ffffff"/>
        </g>

        <path id="boca" d="M 45 62 Q 50 66 55 62" fill="none" stroke="#2b2d42" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="shadow"></div>
  </div>

  <div class="controls">
    <button class="btn" onclick="alimentar()">
      <span class="btn-icon">🐟</span>
      <span>Comer</span>
    </button>
    <button class="btn" onclick="jugar()">
      <span class="btn-icon">🎾</span>
      <span>Jugar</span>
    </button>
  </div>

  <script>
    let hambre = parseInt(localStorage.getItem('michi_v5_hambre')) || 100;
    let felicidad = parseInt(localStorage.getItem('michi_v5_felicidad')) || 100;

    const fillHambre = document.getElementById('fill-hambre');
    const fillFelicidad = document.getElementById('fill-felicidad');
    const txtHambre = document.getElementById('txt-hambre');
    const txtFelicidad = document.getElementById('txt-felicidad');
    const ojos = document.getElementById('ojos');
    const boca = document.getElementById('boca');
    const bocadillo = document.getElementById('bocadillo');
    const michiBox = document.getElementById('michi-box');

    const sabiduriaGatuna = [
      "💡 Cuidado real: Nunca le des leche de vaca a un gato adulto, no la digieren bien.",
      "📜 Historia: En el Antiguo Egipto, los gatos eran sagrados y protegían las cosechas.",
      "💡 Cuidado real: Los gatos prefieren su agua lejos de su plato de comida.",
      "📜 Historia: El maullido fue desarrollado por los gatos solo para comunicarse con los humanos.",
      "💡 Cuidado real: Cepillar a tu gato seguido evita que trague tantas bolas de pelo.",
      "📜 Historia: Un gato en la Edad Media era el mejor protector de los graneros contra plagas.",
      "💡 Cuidado real: Jugar 15 minutos al día ayuda a prevenir el estrés y sobrepeso en gatos."
    ];

    function guardar() {
      localStorage.setItem('michi_v5_hambre', hambre);
      localStorage.setItem('michi_v5_felicidad', felicidad);
    }

    function mostrarTexto(msg) {
      bocadillo.innerText = msg;
    }

    function obtenerConsejoAleatorio() {
      return sabiduriaGatuna[Math.floor(Math.random() * sabiduriaGatuna.length)];
    }

    function actualizarInterfaz(mensajePersonalizado = null) {
      fillHambre.style.width = hambre + '%';
      fillFelicidad.style.width = felicidad + '%';
      txtHambre.innerText = hambre + '%';
      txtFelicidad.innerText = felicidad + '%';

      if (hambre <= 0 || felicidad <= 0) {
        ojos.innerHTML = `
          <path d="M 34 54 L 42 48" stroke="#2b2d42" stroke-width="2" stroke-linecap="round"/>
          <path d="M 34 48 L 42 54" stroke="#2b2d42" stroke-width="2" stroke-linecap="round"/>
          <path d="M 58 54 L 66 48" stroke="#2b2d42" stroke-width="2" stroke-linecap="round"/>
          <path d="M 58 48 L 66 54" stroke="#2b2d42" stroke-width="2" stroke-linecap="round"/>
        `;
        boca.setAttribute('d', 'M 45 66 Q 50 61 55 66');
        
        if (mensajePersonalizado) {
          mostrarTexto(mensajePersonalizado);
        } else if (hambre <= 0 && felicidad <= 0) {
          mostrarTexto("😿 ¡Tengo mucha hambre y pena! Toca 'Comer' 🐟 y 'Jugar' 🎾");
        } else if (hambre <= 0) {
          mostrarTexto("😾 ¡No tengo energía! Toca el botón 'Comer' 🐟");
        } else {
          mostrarTexto("😿 Estoy muy triste... Presiona 'Jugar' 🎾");
        }
      } else if (hambre < 40 || felicidad < 40) {
        ojos.innerHTML = `
          <circle cx="38" cy="52" r="3.5" fill="#2b2d42"/>
          <circle cx="62" cy="52" r="3.5" fill="#2b2d42"/>
        `;
        boca.setAttribute('d', 'M 45 64 L 55 64');
        
        if (mensajePersonalizado) {
          mostrarTexto(mensajePersonalizado);
        } else if (hambre < 40 && felicidad < 40) {
          mostrarTexto("🙀 Presiona 'Comer' 🐟 para alimentarme y 'Jugar' 🎾 para alegrarme.");
        } else if (hambre < 40) {
          mostrarTexto("😾 Me da hambre... ¡Presiona el botón 'Comer' 🐟!");
        } else {
          mostrarTexto("😿 Me estoy aburriendo... Presiona 'Jugar' 🎾.");
        }
      } else {
        ojos.innerHTML = `
          <circle cx="38" cy="52" r="4.5" fill="#2b2d42"/>
          <circle cx="36.5" cy="50.5" r="1.5" fill="#ffffff"/>
          <circle cx="62" cy="52" r="4.5" fill="#2b2d42"/>
          <circle cx="60.5" cy="50.5" r="1.5" fill="#ffffff"/>
        `;
        boca.setAttribute('d', 'M 45 62 Q 50 66 55 62');
        if (mensajePersonalizado) {
          mostrarTexto(mensajePersonalizado);
        }
      }
    }

    function triggerAnim(className) {
      michiBox.classList.remove('happy-bounce', 'eat-wiggle', 'surprise-entry');
      void michiBox.offsetWidth;
      michiBox.classList.add(className);
    }

    function lanzarsorpresaInicial() {
      const emojis = ['🎉', '💛', '🐾', '🎈', '💖'];
      const rect = michiBox.getBoundingClientRect();
      for (let i = 0; i < 10; i++) {
        setTimeout(() => {
          const p = document.createElement('div');
          p.className = 'confetti-particle';
          p.innerText = emojis[Math.floor(Math.random() * emojis.length)];
          p.style.fontSize = (18 + Math.random() * 14) + 'px';
          p.style.left = (rect.left + rect.width / 2 + (Math.random() * 120 - 60)) + 'px';
          p.style.top = (rect.top + rect.height / 2 + (Math.random() * 40 - 20)) + 'px';
          document.body.appendChild(p);
          setTimeout(() => p.remove(), 1200);
        }, i * 80);
      }
    }

    function spawnHeart(e) {
      const heart = document.createElement('div');
      heart.className = 'heart-particle';
      heart.innerText = '💖';
      const rect = michiBox.getBoundingClientRect();
      heart.style.left = (e.clientX || (rect.left + rect.width / 2)) + 'px';
      heart.style.top = (e.clientY || (rect.top + rect.height / 2)) + 'px';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 1000);
    }

    function alimentar() {
      hambre = Math.min(100, hambre + 25);
      if (felicidad < 20) felicidad = Math.min(100, felicidad + 10);
      guardar();
      triggerAnim('eat-wiggle');
      actualizarInterfaz('🐟 ¡Yummy! Tip: Los gatos necesitan alimentos ricos en proteína.');
    }

    function jugar() {
      felicidad = Math.min(100, felicidad + 25);
      hambre = Math.max(0, hambre - 5);
      guardar();
      triggerAnim('happy-bounce');
      actualizarInterfaz('🎾 ¡Qué divertido! Jugar despierta el instinto cazador del gato.');
    }

    function acariciar(e) {
      spawnHeart(e);
      triggerAnim('happy-bounce');
      if (hambre < 40 || felicidad < 40) {
        actualizarInterfaz();
      } else {
        actualizarInterfaz(obtenerConsejoAleatorio());
      }
    }

    setInterval(() => {
      if (hambre > 0 || felicidad > 0) {
        hambre = Math.max(0, hambre - 2);
        felicidad = Math.max(0, felicidad - 2);
        guardar();
        actualizarInterfaz();
      }
    }, 7000);

    window.addEventListener('load', () => {
      actualizarInterfaz();
      lanzarsorpresaInicial();
    });
  </script>
</body>
</html>
