<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Michi - Mi Mascota Virtual</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #fffbeb 0%, #fef3c7 100%);
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 16px 16px max(20px, env(safe-area-inset-bottom));
    }

    .bg-particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      pointer-events: none;
      animation: floatBg 8s infinite ease-in-out;
    }

    @keyframes floatBg {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.5; }
      50% { transform: translateY(-30px) scale(1.1); opacity: 0.9; }
    }

    .top-panel {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 20;
    }

    .nombre-mascota {
      color: #b45309;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .barras-container {
      width: 100%;
      display: flex;
      gap: 10px;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 14px;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(180, 83, 9, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.8);
    }

    .barra-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .barra-label {
      font-size: 11px;
      font-weight: 800;
      color: #78350f;
      display: flex;
      justify-content: space-between;
    }

    .progreso-track {
      background: #fde68a;
      height: 10px;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .progreso-fill {
      height: 100%;
      width: 100%;
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    #fill-hambre { background: linear-gradient(90deg, #34d399, #10b981); }
    #fill-felicidad { background: linear-gradient(90deg, #f59e0b, #d97706); }

    .stage {
      flex: 1;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 5;
    }

    .speech-bubble {
      background: #ffffff;
      color: #78350f;
      padding: 10px 16px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 12px;
      line-height: 1.4;
      box-shadow: 0 6px 16px rgba(180, 83, 9, 0.1);
      margin-bottom: 12px;
      position: relative;
      border: 2px solid #f59e0b;
      max-width: 90%;
      text-align: center;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: #ffffff transparent;
    }

    .michi-wrapper {
      width: 150px;
      height: 150px;
      cursor: pointer;
      position: relative;
      animation: floatIdle 3.5s infinite ease-in-out;
    }

    @keyframes floatIdle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .michi-wrapper.happy-bounce { animation: bounce 0.6s ease; }
    .michi-wrapper.eat-wiggle { animation: chew 0.8s ease; }
    .michi-wrapper.catch-ball { animation: catchJump 0.8s ease; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-20px) scale(1.1, 0.9); }
    }

    @keyframes chew {
      0%, 100% { transform: scale(1); }
      30% { transform: scale(1.08, 0.92); }
      60% { transform: scale(0.95, 1.05); }
    }

    @keyframes catchJump {
      0% { transform: translateY(0); }
      30% { transform: translateY(-25px) rotate(-8deg); }
      100% { transform: translateY(0); }
    }

    .animated-item {
      position: absolute;
      font-size: 28px;
      pointer-events: none;
      z-index: 15;
    }

    .anim-fish { animation: dropFish 0.6s forwards; }
    @keyframes dropFish {
      0% { transform: translateY(-80px) scale(1.2); opacity: 1; }
      100% { transform: translateY(10px) scale(0.4); opacity: 0; }
    }

    .anim-ball { animation: throwBall 0.8s forwards; }
    @keyframes throwBall {
      0% { transform: translate(-100px, 40px) scale(1); }
      50% { transform: translate(-20px, -30px) scale(1.2); }
      100% { transform: translate(0px, 10px) scale(0.2); opacity: 0; }
    }

    .shadow {
      width: 100px;
      height: 12px;
      background: rgba(180, 83, 9, 0.15);
      border-radius: 50%;
      margin-top: 6px;
    }

    .controls {
      width: 100%;
      max-width: 380px;
      display: flex;
      gap: 8px;
      background: #ffffff;
      padding: 8px;
      border-radius: 18px;
      box-shadow: 0 6px 18px rgba(180, 83, 9, 0.15);
      border: 2px solid #f59e0b;
      z-index: 20;
    }

    .btn {
      flex: 1;
      background: #fff3c4;
      color: #78350f;
      border: none;
      padding: 10px 4px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      touch-action: manipulation;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn:active {
      transform: scale(0.95);
      background: #fde68a;
    }

    .btn-icon { font-size: 16px; }

    .heart-particle {
      position: absolute;
      pointer-events: none;
      animation: floatUp 1.2s forwards ease-out;
      z-index: 30;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-card {
      background: #ffffff;
      width: 100%;
      max-width: 360px;
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      border: 3px solid #f59e0b;
    }

    .modal-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 900;
      color: #78350f;
    }

    .btn-cerrar {
      background: #fecdd3;
      color: #9f1239;
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      font-weight: 900;
      cursor: pointer;
    }

    .minijuego-canvas-container {
      width: 100%;
      height: 220px;
      background: #fffbeb;
      border: 2px dashed #f59e0b;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      cursor: crosshair;
    }

    .selector-juegos {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .btn-juego-tab {
      flex: 1;
      padding: 8px;
      font-size: 11px;
      font-weight: 800;
      background: #fef3c7;
      color: #78350f;
      border: 1px solid #f59e0b;
      border-radius: 10px;
      cursor: pointer;
    }

    .btn-juego-tab.active {
      background: #f59e0b;
      color: white;
    }

    .raton-target {
      position: absolute;
      font-size: 28px;
      cursor: pointer;
      user-select: none;
    }

    .canasta-jugador {
      position: absolute;
      bottom: 10px;
      font-size: 32px;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .comida-caida {
      position: absolute;
      font-size: 22px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="bg-particle" style="width: 70px; height: 70px; top: 10%; left: 5%;"></div>
  <div class="bg-particle" style="width: 100px; height: 100px; top: 50%; right: 5%;"></div>

  <div class="top-panel">
    <div class="nombre-mascota">Michi</div>

    <div class="barras-container">
      <div class="barra-item">
        <div class="barra-label"><span>Hambre</span><span id="txt-hambre">100%</span></div>
        <div class="progreso-track"><div class="progreso-fill" id="fill-hambre"></div></div>
      </div>
      <div class="barra-item">
        <div class="barra-label"><span>Felicidad</span><span id="txt-felicidad">100%</span></div>
        <div class="progreso-track"><div class="progreso-fill" id="fill-felicidad"></div></div>
      </div>
    </div>
  </div>

  <div class="stage" id="stage-area">
    <div class="speech-bubble" id="bocadillo">¡Hola! Tócame para mimarme o aprender algo nuevo 🐾</div>
    
    <div class="michi-wrapper" id="michi-box" onclick="acariciar(event)">
      <svg id="michi-svg" viewBox="0 0 100 100" width="100%" height="100%">
        <path d="M 75 75 Q 92 60 85 45" fill="none" stroke="#e67e22" stroke-width="5" stroke-linecap="round"/>
        <ellipse cx="28" cy="78" rx="7" ry="5" fill="#ffffff" stroke="#d35400" stroke-width="1"/>
        <ellipse cx="72" cy="78" rx="7" ry="5" fill="#ffffff" stroke="#d35400" stroke-width="1"/>
        <polygon points="22,40 12,18 36,28" fill="#e67e22" stroke="#d35400" stroke-width="1.5"/>
        <polygon points="24,36 17,22 33,28" fill="#f2a685"/>
        <polygon points="78,40 88,18 64,28" fill="#e67e22" stroke="#d35400" stroke-width="1.5"/>
        <polygon points="76,36 83,22 67,28" fill="#f2a685"/>
        <ellipse cx="50" cy="58" rx="32" ry="28" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
        <path d="M 50 42 C 40 46 38 62 38 72 C 44 80 56 80 62 72 C 62 62 60 46 50 42 Z" fill="#ffffff"/>
        <polygon points="48,59 52,59 50,62" fill="#e8a7a1"/>
        <g id="ojos">
          <circle cx="37" cy="53" r="5" fill="#5c3d2e"/>
          <circle cx="37" cy="53" r="3" fill="#1f110b"/>
          <circle cx="35.5" cy="51.5" r="1.2" fill="#ffffff"/>
          <circle cx="63" cy="53" r="5" fill="#5c3d2e"/>
          <circle cx="63" cy="53" r="3" fill="#1f110b"/>
          <circle cx="61.5" cy="51.5" r="1.2" fill="#ffffff"/>
        </g>
        <path id="boca" d="M 45 64 Q 50 67 55 64" fill="none" stroke="#2c3e50" stroke-width="1.8" stroke-linecap="round"/>
        <g id="patitas">
          <ellipse cx="42" cy="78" rx="5" ry="4" fill="#ffffff" stroke="#d35400" stroke-width="1"/>
          <ellipse cx="58" cy="78" rx="5" ry="4" fill="#ffffff" stroke="#d35400" stroke-width="1"/>
        </g>
      </svg>
    </div>

    <div class="shadow"></div>
  </div>

  <div class="controls">
    <button class="btn" id="btn-comer" onclick="alimentar()">
      <span class="btn-icon">🐟</span>
      <span>Comer</span>
    </button>
    <button class="btn" id="btn-jugar" onclick="jugar()">
      <span class="btn-icon">🎾</span>
      <span>Jugar</span>
    </button>
    <button class="btn" onclick="abrirMinijuegos()">
      <span class="btn-icon">🎮</span>
      <span>Minijuegos</span>
    </button>
  </div>

  <div class="modal-overlay" id="modal-minijuegos">
    <div class="modal-card">
      <div class="modal-header">
        <span id="titulo-minijuego">Caza-Ratones 🐭</span>
        <button class="btn-cerrar" onclick="cerrarMinijuegos()">✕</button>
      </div>
      
      <div class="selector-juegos">
        <button class="btn-juego-tab active" id="tab-raton" onclick="seleccionarJuego('raton')">🐭 Cazarratón</button>
        <button class="btn-juego-tab" id="tab-atrapa" onclick="seleccionarJuego('atrapa')">🧶 Atrapacomida</button>
      </div>

      <div class="minijuego-canvas-container" id="game-canvas"></div>

      <div style="font-size: 12px; font-weight: 700; color: #78350f;" id="puntos-txt">Puntos: 0</div>
    </div>
  </div>

  <script>
    // SISTEMA DE SONIDOS SINTETIZADOS SUAVES
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function reproducirSonido(tipo) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (tipo === 'miau') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.12);
        osc.frequency.exponentialRampToValueAtTime(750, now + 0.25);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (tipo === 'comer') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(250, now);
        osc.frequency.setValueAtTime(350, now + 0.05);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (tipo === 'jugar') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (tipo === 'punto') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.08);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
        osc.start(now);
        osc.stop(now + 0.18);
      }
    }

    let hambre = parseInt(localStorage.getItem('michi_v9_hambre')) || 100;
    let felicidad = parseInt(localStorage.getItem('michi_v9_felicidad')) || 100;

    const fillHambre = document.getElementById('fill-hambre');
    const fillFelicidad = document.getElementById('fill-felicidad');
    const txtHambre = document.getElementById('txt-hambre');
    const txtFelicidad = document.getElementById('txt-felicidad');
    const ojos = document.getElementById('ojos');
    const boca = document.getElementById('boca');
    const bocadillo = document.getElementById('bocadillo');
    const michiBox = document.getElementById('michi-box');
    const stageArea = document.getElementById('stage-area');

    const frasesComer = [
      "🐟 ¡Mmm... delicioso!",
      "🐱 ¡Gracias por la comida!",
      "😋 Mi pancita está feliz.",
      "🐟 ¡Ñam ñam, qué rico!"
    ];

    const frasesJugar = [
      "🎾 ¡Sí! Me encanta este juego.",
      "😸 ¡Qué divertido!",
      "🎾 ¡Atrapé la pelota!",
      "🐾 ¡Buen tiro!"
    ];

    const sabiduriaGatuna = [
      "💡 Cuidado real: Nunca le des leche de vaca a un gato adulto, no la digieren bien.",
      "📜 Historia: En el Antiguo Egipto, los gatos eran sagrados y protegían las cosechas.",
      "💡 Cuidado real: Los gatos prefieren su agua alejada de su plato de comida.",
      "📜 Historia: El maullido fue desarrollado por los gatos casi en su totalidad para comunicarse con los humanos.",
      "💡 Cuidado real: Cepillar a tu gato seguido evita que trague tantas bolas de pelo.",
      "📜 Historia: Un gato en la Edad Media era el mejor protector de los graneros contra plagas.",
      "💡 Cuidado real: Jugar 15 minutos al día ayuda a prevenir el estrés y sobrepeso en gatos."
    ];

    function guardar() {
      localStorage.setItem('michi_v9_hambre', hambre);
      localStorage.setItem('michi_v9_felicidad', felicidad);
    }

    function mostrarTexto(msg) {
      bocadillo.innerText = msg;
    }

    function obtenerElementoAleatorio(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    function actualizarInterfaz(mensajePersonalizado = null) {
      fillHambre.style.width = hambre + '%';
      fillFelicidad.style.width = felicidad + '%';
      txtHambre.innerText = hambre + '%';
      txtFelicidad.innerText = felicidad + '%';

      if (hambre <= 0 || felicidad <= 0) {
        ojos.innerHTML = `
          <path d="M 33 55 L 41 49" stroke="#2c3e50" stroke-width="2" stroke-linecap="round"/>
          <path d="M 33 49 L 41 55" stroke="#2c3e50" stroke-width="2" stroke-linecap="round"/>
          <path d="M 59 55 L 67 49" stroke="#2c3e50" stroke-width="2" stroke-linecap="round"/>
          <path d="M 59 49 L 67 55" stroke="#2c3e50" stroke-width="2" stroke-linecap="round"/>
        `;
        boca.setAttribute('d', 'M 45 67 Q 50 62 55 67');
        
        if (mensajePersonalizado) {
          mostrarTexto(mensajePersonalizado);
        } else if (hambre <= 0 && felicidad <= 0) {
          mostrarTexto("😿 ¡Tengo mucha hambre y pena! Toca 'Comer' 🐟 y 'Jugar' 🎾");
        } else if (hambre <= 0) {
          mostrarTexto("😾 ¡No tengo energía! Toca el botón 'Comer' 🐟");
        } else {
          mostrarTexto("😿 Estoy triste... Presiona 'Jugar' 🎾");
        }
      } else if (hambre < 40 || felicidad < 40) {
        ojos.innerHTML = `
          <circle cx="37" cy="53" r="3.5" fill="#1f110b"/>
          <circle cx="63" cy="53" r="3.5" fill="#1f110b"/>
        `;
        boca.setAttribute('d', 'M 45 65 L 55 65');
        
        if (mensajePersonalizado) {
          mostrarTexto(mensajePersonalizado);
        } else if (hambre < 40 && felicidad < 40) {
          mostrarTexto("🙀 Presiona 'Comer' 🐟 para alimentarme y 'Jugar' 🎾 para alegrarme.");
        } else if (hambre < 40) {
          mostrarTexto("😾 Tengo hambre... ¡Presiona el botón 'Comer' 🐟!");
        } else {
          mostrarTexto("😿 Me estoy aburriendo... Presiona 'Jugar' 🎾.");
        }
      } else {
        ojos.innerHTML = `
          <circle cx="37" cy="53" r="5" fill="#5c3d2e"/>
          <circle cx="37" cy="53" r="3" fill="#1f110b"/>
          <circle cx="35.5" cy="51.5" r="1.2" fill="#ffffff"/>
          <circle cx="63" cy="53" r="5" fill="#5c3d2e"/>
          <circle cx="63" cy="53" r="3" fill="#1f110b"/>
          <circle cx="61.5" cy="51.5" r="1.2" fill="#ffffff"/>
        `;
        boca.setAttribute('d', 'M 45 64 Q 50 67 55 64');
        if (mensajePersonalizado) {
          mostrarTexto(mensajePersonalizado);
        }
      }
    }

    function triggerAnim(className) {
      michiBox.classList.remove('happy-bounce', 'eat-wiggle', 'catch-ball');
      void michiBox.offsetWidth;
      michiBox.classList.add(className);
    }

    function spawnHeart(e) {
      const heart = document.createElement('div');
      heart.className = 'heart-particle';
      heart.innerText = '💖';
      const rect = michiBox.getBoundingClientRect();
      heart.style.left = (e ? (e.clientX || (rect.left + rect.width / 2)) : (rect.left + rect.width / 2)) + 'px';
      heart.style.top = (e ? (e.clientY || (rect.top + rect.height / 2)) : (rect.top + rect.height / 2)) + 'px';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 1000);
    }

    function alimentar() {
      reproducirSonido('comer');
      hambre = Math.min(100, hambre + 25);
      if (felicidad < 20) felicidad = Math.min(100, felicidad + 10);
      guardar();

      const fish = document.createElement('div');
      fish.className = 'animated-item anim-fish';
      fish.innerText = '🐟';
      stageArea.appendChild(fish);

      boca.setAttribute('d', 'M 44 63 Q 50 72 56 63');

      setTimeout(() => {
        triggerAnim('eat-wiggle');
        fish.remove();
        actualizarInterfaz(obtenerElementoAleatorio(frasesComer));
      }, 500);
    }

    function jugar() {
      reproducirSonido('jugar');
      felicidad = Math.min(100, felicidad + 25);
      hambre = Math.max(0, hambre - 5);
      guardar();

      const ball = document.createElement('div');
      ball.className = 'animated-item anim-ball';
      ball.innerText = '🎾';
      stageArea.appendChild(ball);

      setTimeout(() => {
        triggerAnim('catch-ball');
      }, 200);

      setTimeout(() => {
        ball.remove();
        actualizarInterfaz(obtenerElementoAleatorio(frasesJugar));
      }, 700);
    }

    function acariciar(e) {
      reproducirSonido('miau');
      spawnHeart(e);
      triggerAnim('happy-bounce');
      if (hambre < 40 || felicidad < 40) {
        actualizarInterfaz();
      } else {
        actualizarInterfaz(obtenerElementoAleatorio(sabiduriaGatuna));
      }
    }

    setInterval(() => {
      if (hambre > 0 || felicidad > 0) {
        hambre = Math.max(0, hambre - 2);
        felicidad = Math.max(0, felicidad - 2);
        guardar();
        actualizarInterfaz();
      }
    }, 4000);

    let minijuegoActual = 'raton';
    let juegoLoop = null;
    let puntos = 0;

    function abrirMinijuegos() {
      document.getElementById('modal-minijuegos').style.display = 'flex';
      seleccionarJuego('raton');
    }

    function cerrarMinijuegos() {
      document.getElementById('modal-minijuegos').style.display = 'none';
      clearInterval(juegoLoop);
      const canvas = document.getElementById('game-canvas');
      canvas.innerHTML = '';
      actualizarInterfaz("¡Bien jugado! 🐾");
    }

    function seleccionarJuego(tipo) {
      minijuegoActual = tipo;
      document.getElementById('tab-raton').classList.toggle('active', tipo === 'raton');
      document.getElementById('tab-atrapa').classList.toggle('active', tipo === 'atrapa');
      document.getElementById('titulo-minijuego').innerText = tipo === 'raton' ? 'Caza-Ratones 🐭' : 'Atrapa-Croquetas 🧶';
      iniciarJuego();
    }

    function iniciarJuego() {
      clearInterval(juegoLoop);
      const canvas = document.getElementById('game-canvas');
      canvas.innerHTML = '';
      puntos = 0;
      document.getElementById('puntos-txt').innerText = `Puntos: ${puntos}`;

      if (minijuegoActual === 'raton') {
        juegoLoop = setInterval(spawnRaton, 900);
      } else if (minijuegoActual === 'atrapa') {
        const canasta = document.createElement('div');
        canasta.className = 'canasta-jugador';
        canasta.innerText = '🧺';
        canasta.id = 'canasta';
        canasta.style.left = '50%';
        canvas.appendChild(canasta);

        canvas.onmousemove = (e) => {
          const rect = canvas.getBoundingClientRect();
          canasta.style.left = Math.max(20, Math.min(rect.width - 20, e.clientX - rect.left)) + 'px';
        };

        canvas.ontouchmove = (e) => {
          const rect = canvas.getBoundingClientRect();
          canasta.style.left = Math.max(20, Math.min(rect.width - 20, e.touches[0].clientX - rect.left)) + 'px';
        };

        juegoLoop = setInterval(spawnComidaCaida, 1000);
      }
    }

    function spawnRaton() {
      const canvas = document.getElementById('game-canvas');
      if (canvas.children.length > 4) return;

      const raton = document.createElement('div');
      raton.className = 'raton-target';
      raton.innerText = '🐭';
      raton.style.left = Math.random() * 80 + 10 + '%';
      raton.style.top = Math.random() * 70 + 10 + '%';

      raton.onclick = () => {
        reproducirSonido('punto');
        puntos++;
        felicidad = Math.min(100, felicidad + 4);
        guardar();
        document.getElementById('puntos-txt').innerText = `Puntos: ${puntos} (+Felicidad!)`;
        spawnHeart();
        raton.remove();
      };

      canvas.appendChild(raton);
      setTimeout(() => raton.remove(), 1200);
    }

    function spawnComidaCaida() {
      const canvas = document.getElementById('game-canvas');
      const comida = document.createElement('div');
      comida.className = 'comida-caida';
      comida.innerText = '🐟';
      comida.style.left = Math.random() * 80 + 10 + '%';
      comida.style.top = '0px';
      canvas.appendChild(comida);

      let posY = 0;
      const caidaInt = setInterval(() => {
        posY += 4;
        comida.style.top = posY + 'px';

        const canasta = document.getElementById('canasta');
        if (canasta) {
          const cRect = canasta.getBoundingClientRect();
          const fRect = comida.getBoundingClientRect();

          if (fRect.bottom >= cRect.top && fRect.left < cRect.right && fRect.right > cRect.left) {
            reproducirSonido('punto');
            puntos++;
            hambre = Math.min(100, hambre + 5);
            guardar();
            document.getElementById('puntos-txt').innerText = `Puntos: ${puntos} (+Hambre!)`;
            clearInterval(caidaInt);
            comida.remove();
          }
        }

        if (posY > 200) {
          clearInterval(caidaInt);
          comida.remove();
        }
      }, 30);
    }

    window.addEventListener('load', () => {
      actualizarInterfaz();
    });
  </script>
</body>
</html>
