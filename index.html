<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Michi - Virtual Pet</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #fce7f3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .consola {
      background: #f472b6;
      padding: 24px;
      border-radius: 32px;
      box-shadow: 0 12px 0 #db2777, 0 20px 25px -5px rgba(0, 0, 0, 0.15);
      width: 340px;
      text-align: center;
      border: 4px solid #ec4899;
    }

    .nombre-mascota {
      color: #ffffff;
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 16px;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0px #db2777;
    }

    .pantalla {
      background: linear-gradient(180deg, #fff1f2 0%, #ffe4e6 100%);
      border: 4px solid #db2777;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      position: relative;
    }

    .contenedor-michi {
      width: 150px;
      height: 150px;
      margin: 10px auto 15px auto;
      transition: transform 0.2s ease;
    }

    .contenedor-michi:hover {
      transform: scale(1.05);
    }

    .barras {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .barra-info {
      font-size: 13px;
      font-weight: 700;
      color: #9d174d;
      text-align: left;
    }

    .progreso {
      background-color: #fbcfe8;
      border-radius: 12px;
      height: 14px;
      width: 100%;
      overflow: hidden;
      border: 2px solid #db2777;
      margin-top: 4px;
    }

    .relleno {
      background: linear-gradient(90deg, #34d399 0%, #10b981 100%);
      height: 100%;
      width: 100%;
      transition: width 0.4s ease;
    }

    #bar-felicidad {
      background: linear-gradient(90deg, #fbbf24 0%, #f59e0b 100%);
    }

    .controles {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    button {
      background-color: #fb7185;
      color: #ffffff;
      border: none;
      border-bottom: 4px solid #e11d48;
      padding: 12px 16px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      flex: 1;
      transition: all 0.1s ease;
    }

    button:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    .btn-reset {
      background-color: #94a3b8;
      border-bottom-color: #64748b;
    }
  </style>
</head>
<body>

  <div class="consola">
    <div class="nombre-mascota">Michi</div>

    <div class="pantalla">
      <div class="contenedor-michi">
        <svg id="michi-svg" viewBox="0 0 100 100" width="100%" height="100%">
          <!-- Cola del gato -->
          <path d="M 75 75 Q 90 65 85 50" fill="none" stroke="#f4a261" stroke-width="5" stroke-linecap="round"/>

          <!-- Orejas -->
          <polygon points="22,40 12,18 36,28" fill="#f4a261" stroke="#e76f51" stroke-width="2"/>
          <polygon points="24,36 17,22 33,28" fill="#ffb703"/>
          
          <polygon points="78,40 88,18 64,28" fill="#f4a261" stroke="#e76f51" stroke-width="2"/>
          <polygon points="76,36 83,22 67,28" fill="#ffb703"/>

          <!-- Cuerpo / Cabeza de Michi -->
          <ellipse cx="50" cy="58" rx="32" ry="28" fill="#f4a261" stroke="#e76f51" stroke-width="2.5"/>

          <!-- Mofletes rosados -->
          <ellipse cx="32" cy="62" rx="5" ry="3" fill="#ffb5a7" opacity="0.8"/>
          <ellipse cx="68" cy="62" rx="5" ry="3" fill="#ffb5a7" opacity="0.8"/>

          <!-- Bigotes -->
          <line x1="18" y1="58" x2="30" y2="60" stroke="#2b2d42" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="16" y1="64" x2="29" y2="63" stroke="#2b2d42" stroke-width="1.5" stroke-linecap="round"/>
          
          <line x1="82" y1="58" x2="70" y2="60" stroke="#2b2d42" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="84" y1="64" x2="71" y2="63" stroke="#2b2d42" stroke-width="1.5" stroke-linecap="round"/>

          <!-- Nariz -->
          <polygon points="48,58 52,58 50,60" fill="#e76f51"/>

          <!-- Ojos -->
          <g id="ojos">
            <circle cx="38" cy="52" r="4.5" fill="#2b2d42"/>
            <circle cx="36.5" cy="50.5" r="1.5" fill="#ffffff"/>
            
            <circle cx="62" cy="52" r="4.5" fill="#2b2d42"/>
            <circle cx="60.5" cy="50.5" r="1.5" fill="#ffffff"/>
          </g>

          <!-- Boca -->
          <path id="boca" d="M 45 62 Q 50 66 55 62" fill="none" stroke="#2b2d42" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="barras">
        <div class="barra-info">
          <span>Hambre</span>
          <div class="progreso"><div class="relleno" id="bar-hambre"></div></div>
        </div>
        <div class="barra-info">
          <span>Felicidad</span>
          <div class="progreso"><div class="relleno" id="bar-felicidad"></div></div>
        </div>
      </div>
    </div>

    <div class="controles">
      <button onclick="alimentar()">Comer</button>
      <button onclick="jugar()">Jugar</button>
      <button class="btn-reset" onclick="reiniciar()">Reset</button>
    </div>
  </div>

  <script>
    let hambre = parseInt(localStorage.getItem('michi_cat_hambre')) || 100;
    let felicidad = parseInt(localStorage.getItem('michi_cat_felicidad')) || 100;

    const barHambre = document.getElementById('bar-hambre');
    const barFelicidad = document.getElementById('bar-felicidad');
    const ojos = document.getElementById('ojos');
    const boca = document.getElementById('boca');

    function guardar() {
      localStorage.setItem('michi_cat_hambre', hambre);
      localStorage.setItem('michi_cat_felicidad', felicidad);
    }

    function actualizarInterfaz() {
      barHambre.style.width = hambre + '%';
      barFelicidad.style.width = felicidad + '%';

      if (hambre <= 0 || felicidad <= 0) {
        // Triste / Derrotado
        ojos.innerHTML = `
          <path d="M 34 54 L 42 48" stroke="#2b2d42" stroke-width="2" stroke-linecap="round"/>
          <path d="M 34 48 L 42 54" stroke="#2b2d42" stroke-width="2" stroke-linecap="round"/>
          <path d="M 58 54 L 66 48" stroke="#2b2d42" stroke-width="2" stroke-linecap="round"/>
          <path d="M 58 48 L 66 54" stroke="#2b2d42" stroke-width="2" stroke-linecap="round"/>
        `;
        boca.setAttribute('d', 'M 45 66 Q 50 61 55 66');
      } else if (hambre < 40 || felicidad < 40) {
        // Preocupado
        ojos.innerHTML = `
          <circle cx="38" cy="52" r="3.5" fill="#2b2d42"/>
          <circle cx="62" cy="52" r="3.5" fill="#2b2d42"/>
        `;
        boca.setAttribute('d', 'M 45 64 L 55 64');
      } else {
        // Feliz / Normal
        ojos.innerHTML = `
          <circle cx="38" cy="52" r="4.5" fill="#2b2d42"/>
          <circle cx="36.5" cy="50.5" r="1.5" fill="#ffffff"/>
          <circle cx="62" cy="52" r="4.5" fill="#2b2d42"/>
          <circle cx="60.5" cy="50.5" r="1.5" fill="#ffffff"/>
        `;
        boca.setAttribute('d', 'M 45 62 Q 50 66 55 62');
      }
    }

    function alimentar() {
      if (hambre <= 0 || felicidad <= 0) return;
      hambre = Math.min(100, hambre + 15);
      guardar();
      actualizarInterfaz();
    }

    function jugar() {
      if (hambre <= 0 || felicidad <= 0) return;
      felicidad = Math.min(100, felicidad + 15);
      hambre = Math.max(0, hambre - 5);
      guardar();
      actualizarInterfaz();
    }

    function reiniciar() {
      hambre = 100;
      felicidad = 100;
      guardar();
      actualizarInterfaz();
    }

    // El hambre y la felicidad bajan cada 7 segundos (7000 ms)
    setInterval(() => {
      if (hambre > 0 && felicidad > 0) {
        hambre = Math.max(0, hambre - 2);
        felicidad = Math.max(0, felicidad - 2);
        guardar();
        actualizarInterfaz();
      }
    }, 7000);

    actualizarInterfaz();
  </script>
</body>
</html>
